[package]
name = "sill-host-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

autobins = false

[lib]
name = "sill_host_windows"
path = "src/lib.rs"

# The console host (tests, development; as SillHost on the Mac).
[[bin]]
name = "sill-host-windows"
path = "src/main.rs"

# Sill.exe: the tray app (as Sill.app on the Mac).
[[bin]]
name = "Sill"
path = "src/bin/sill.rs"

[dependencies]
sill-host-core = { path = "../sill-host-core" }
sill-protocol = { path = "../sill-protocol" }
# Sill.exe's settings file (MIT OR Apache-2.0).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JPEG thumbnails and PNG icons and cursors (MIT OR Apache-2.0). Portable, so the image helpers are
# unit-tested on any machine.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
# Sill.exe's icon and version resource (MIT): finds the Windows SDK's rc.exe.
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
# The pairing window's QR code (MIT; no dependencies).
qrcodegen = "1.8"
# Microsoft's Win32 and WinRT bindings (MIT OR Apache-2.0).
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_NetworkManagement_Dns",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
